<main class="login-page"><form class="login-card" (ngSubmit)="login()"><h1>ABB MLOps Platform</h1><p>Sign in to manage the model lifecycle.</p><label>Email<input name="email" type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" required /></label><label>Password<input name="password" type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" required /></label>@if (error()) { <p class="error" role="alert">{{ error() }}</p> }<button type="submit" [disabled]="isLoading()">{{ isLoading() ? 'Signing in…' : 'Sign in' }}</button></form></main>
